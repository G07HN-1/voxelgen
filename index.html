<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Background Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111b21;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #ffffff;
            text-align: center;
        }

        #controls {
            background: #1f2e35;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
            width: 100%;
            max-width: 800px;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        label {
            font-size: 0.85rem;
            color: #bbbbbb;
            margin-bottom: 6px;
            display: block;
        }

        input[type="number"],
        input[type="color"],
        button {
            width: 100%;
            padding: 0.7rem 1rem;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            background-color: #2f3e46;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus,
        button:hover {
            background-color: #3d515a;
        }

        button {
            background-color: #4aa8c0;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: #62c0db;
        }

        canvas {
            border-radius: 12px;
            border: 2px solid #ffffff10;
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 1.6rem;
            }

            #controls {
                padding: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <h1>Voxel Background Generator</h1>

    <div id="controls">
        <div>
            <label for="widthInput">Width</label>
            <input type="number" id="widthInput" value="512" />
        </div>
        <div>
            <label for="heightInput">Height</label>
            <input type="number" id="heightInput" value="512" />
        </div>
        <div>
            <label for="noisinessInput">Noisiness</label>
            <input type="number" id="noisinessInput" value="50" min="10" max="500" />
        </div>
        <div>
            <label for="bgColorInput">Background Color</label>
            <input type="color" id="bgColorInput" value="#7c46af" />
        </div>
        <div>
            <label>&nbsp;</label>
            <button onclick="generate()">Generate</button>
        </div>
        <div>
            <label>&nbsp;</label>
            <button onclick="downloadImage()">Download PNG</button>
        </div>
    </div>

    <canvas id="bg"></canvas>

    <script>
        const canvas = document.getElementById("bg");
        const ctx = canvas.getContext("2d");

        function generate() {
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const controlsHeight = document.getElementById("controls").offsetHeight + 150;

            const width = Math.min(parseInt(document.getElementById("widthInput").value, 10), viewportWidth * 0.95);
            const height = Math.min(parseInt(document.getElementById("heightInput").value, 10), viewportHeight - controlsHeight);

            const noisiness = parseInt(document.getElementById("noisinessInput").value, 10);
            const bgColor = document.getElementById("bgColorInput").value;

            canvas.width = width;
            canvas.height = height;

            drawBackground(width, height, noisiness, bgColor);
        }

        function drawBackground(width, height, noisiness, bgColor) {
            const bottomColor = bgColor;
            const topColor = lightenColor(bgColor, 30);

            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(1, bottomColor);
            gradient.addColorStop(0, topColor);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const centerHighlight = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width / 3);
            centerHighlight.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
            centerHighlight.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = centerHighlight;
            ctx.fillRect(0, 0, width, height);

            const placed = [];
            const rotationDegrees = 37.5;
            const rotationRadians = rotationDegrees * (Math.PI / 180);
            let attempts = 0;
            let maxAttempts = noisiness * 5;

            while (placed.length < noisiness && attempts < maxAttempts) {
                attempts++;
                const size = Math.random() * 30 + 10;
                const x = Math.random() * width;
                const y = Math.random() * height;

                const baseAlpha = 0.05;
                const minAlpha = 0.15;
                const normalizedY = y / height;
                const alpha = baseAlpha - (baseAlpha - minAlpha) * normalizedY;

                const half = size / 2;
                const rotatedHalf = Math.abs(half * Math.cos(rotationRadians)) + Math.abs(half * Math.sin(rotationRadians));
                const box = {
                    left: x - rotatedHalf,
                    right: x + rotatedHalf,
                    top: y - rotatedHalf,
                    bottom: y + rotatedHalf
                };

                let overlaps = false;
                for (let other of placed) {
                    if (
                        box.right > other.left &&
                        box.left < other.right &&
                        box.bottom > other.top &&
                        box.top < other.bottom
                    ) {
                        overlaps = true;
                        break;
                    }
                }

                if (!overlaps) {
                    placed.push(box);
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(rotationRadians);
                    ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                    ctx.fillRect(-half, -half, size, size);
                    ctx.restore();
                }
            }
        }

        function lightenColor(color, percent) {
            let r = parseInt(color.slice(1, 3), 16);
            let g = parseInt(color.slice(3, 5), 16);
            let b = parseInt(color.slice(5, 7), 16);
            r = Math.min(255, Math.floor(r + (255 - r) * (percent / 100)));
            g = Math.min(255, Math.floor(g + (255 - g) * (percent / 100)));
            b = Math.min(255, Math.floor(b + (255 - b) * (percent / 100)));
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'voxel-background.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        window.addEventListener('resize', generate);
        generate();
    </script>
</body>

</html>
