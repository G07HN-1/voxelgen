<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Background Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        select {
            width: 100%;
            padding: 0.7rem 1rem;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            background-color: #2f3e46;
            color: #ffffff;
            outline: none;
            appearance: none;
            transition: all 0.2s ease;
        }

        select:focus {
            background-color: #3d515a;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 100%;
            height: 42px;
            border-radius: 8px;
            background-color: #2f3e46;
            position: relative;
            cursor: pointer;
        }

        input[type="checkbox"]::before {
            content: 'Off';
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            color: #fff;
            font-size: 0.9rem;
        }

        input[type="checkbox"]:checked {
            background-color: #4aa8c0;
        }

        input[type="checkbox"]:checked::before {
            content: 'On';
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #111b21;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #ffffff;
            text-align: center;
        }

        #controls {
            background: #1f2e35;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
            width: 100%;
            max-width: 800px;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        label {
            font-size: 0.85rem;
            color: #bbbbbb;
            margin-bottom: 6px;
            display: block;
        }

        input[type="number"],
        input[type="color"],
        input[type="checkbox"],
        button {
            width: 100%;
            padding: 0.7rem 1rem;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            background-color: #2f3e46;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus,
        button:hover {
            background-color: #3d515a;
        }

        button {
            background-color: #4aa8c0;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: #62c0db;
        }

        canvas {
            border-radius: 12px;
            border: 2px solid #ffffff10;
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 1.6rem;
            }

            #controls {
                padding: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <h1>Voxel Background Generator</h1>

    <div id="controls">
        <div>
            <label for="widthInput">Width</label>
            <input type="number" id="widthInput" value="512" min="1" onchange="generate()" />
        </div>
        <div>
            <label for="heightInput">Height</label>
            <input type="number" id="heightInput" value="512" min="1" onchange="generate()" />
        </div>
        <div>
            <label for="noisinessInput">Noisiness</label>
            <input type="number" id="noisinessInput" value="50" min="10" max="500" onchange="generate()" />
        </div>
        <div>
            <label for="bgColorInput">Background Color</label>
            <input type="color" id="bgColorInput" value="#7c46af" onchange="generate()" />
        </div>
        <div>
            <label for="cubeColorInput">Cube Color</label>
            <input type="color" id="cubeColorInput" value="#000000" onchange="generate()" />
        </div>
        <div>
            <label for="sizeInput">Shape Scale</label>
            <input type="number" id="sizeInput" value="1" min="1" max="50" step="1" onchange="generate()" />
        </div>
        <div>
            <label for="shapeSelect">Shape</label>
            <select id="shapeSelect" onchange="generate()">
                <option value="square">Square</option>
                <option value="circle">Circle</option>
                <option value="triangle">Triangle</option>
                <option value="hexagon">Hexagon</option>
                <option value="pentagon">Pentagon</option>
            </select>
        </div>
        <div>
            <label for="randomizeColorToggle">Randomize Colors</label>
            <input type="checkbox" id="randomizeColorToggle" onchange="generate()" />
        </div>
        <div>
            <label>&nbsp;</label>
            <button onclick="generate()">Generate</button>
        </div>
        <div>
            <label>&nbsp;</label>
            <button onclick="downloadImage()">Download PNG</button>
        </div>
        <div>
            <label>&nbsp;</label>
            <button onclick="downloadJSON()">Download JSON</button>
        </div>
        <div>
            <label>&nbsp;</label>
            <button onclick="copyJSON()">Copy JSON</button>
        </div>
    </div>

    <canvas id="bg"></canvas>

    <script>
        const canvas = document.getElementById("bg");
        const ctx = canvas.getContext("2d");

        let placed = [];
        let topColorHex = "#ffffff";
        let bottomColorHex = "#000000";

        function generate() {
            const width = parseInt(document.getElementById("widthInput").value, 10);
            const height = parseInt(document.getElementById("heightInput").value, 10);
            const noisiness = parseInt(document.getElementById("noisinessInput").value, 10);
            const bgColor = document.getElementById("bgColorInput").value;

            canvas.width = width;
            canvas.height = height;

            placed = [];
            drawBackground(width, height, noisiness, bgColor);
        }

        function hexToFloatArray(hex) {
            const r = parseInt(hex.slice(1, 3), 16) / 255;
            const g = parseInt(hex.slice(3, 5), 16) / 255;
            const b = parseInt(hex.slice(5, 7), 16) / 255;
            return [r.toFixed(3), g.toFixed(3), b.toFixed(3)].map(Number);
        }

        function lightenColor(color, percent) {
            let r = parseInt(color.slice(1, 3), 16);
            let g = parseInt(color.slice(3, 5), 16);
            let b = parseInt(color.slice(5, 7), 16);
            r = Math.min(255, Math.floor(r + (255 - r) * (percent / 100)));
            g = Math.min(255, Math.floor(g + (255 - g) * (percent / 100)));
            b = Math.min(255, Math.floor(b + (255 - b) * (percent / 100)));
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        function drawBackground(width, height, noisiness, bgColor) {
            bottomColorHex = bgColor;
            topColorHex = lightenColor(bgColor, 30);

            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(1, bottomColorHex);
            gradient.addColorStop(0, topColorHex);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            const centerHighlight = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, width / 3);
            centerHighlight.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
            centerHighlight.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = centerHighlight;
            ctx.fillRect(0, 0, width, height);

            const rotationDegrees = 37.5;
            const rotationRadians = rotationDegrees * (Math.PI / 180);
            let attempts = 0;
            const maxAttempts = noisiness * 5;

            while (placed.length < noisiness && attempts < maxAttempts) {
                const sizeInput = document.getElementById("sizeInput").value
                console.log(sizeInput > 0 ? 1 : 1)
                attempts++;
                const size = (Math.random() * 30 + 10) * sizeInput
                const x = Math.random() * width;
                const y = Math.random() * height;

                const baseAlpha = 0.05;
                const minAlpha = 0.15;
                const normalizedY = y / height;
                const alpha = baseAlpha - (baseAlpha - minAlpha) * normalizedY;

                const half = size / 2;
                const rotatedHalf = Math.abs(half * Math.cos(rotationRadians)) + Math.abs(half * Math.sin(rotationRadians));
                const box = {
                    left: x - rotatedHalf,
                    right: x + rotatedHalf,
                    top: y - rotatedHalf,
                    bottom: y + rotatedHalf,
                    centerX: x,
                    centerY: y,
                    size: size,
                    alpha: alpha
                };

                let overlaps = false;
                for (let other of placed) {
                    if (
                        box.right > other.left &&
                        box.left < other.right &&
                        box.bottom > other.top &&
                        box.top < other.bottom
                    ) {
                        overlaps = true;
                        break;
                    }
                }

                if (!overlaps) {
                    placed.push(box);
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(rotationRadians);
                    const [r, g, b] = getCubeColor().map(c => Math.round(c * 255));
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    const shape = document.getElementById("shapeSelect").value;
                    drawShape(ctx, shape, size, alpha, [r, g, b]);
                    ctx.restore();
                }
            }
        }
        function drawShape(ctx, shape, size, alpha, color) {
            const half = size / 2;
            ctx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;

            ctx.beginPath();

            switch (shape) {
                case 'circle':
                    ctx.arc(0, 0, half, 0, Math.PI * 2);
                    break;
                case 'triangle':
                    for (let i = 0; i < 3; i++) {
                        const angle = (i / 3) * Math.PI * 2 - Math.PI / 2;
                        const x = half * Math.cos(angle);
                        const y = half * Math.sin(angle);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    break;
                case 'hexagon':
                    for (let i = 0; i < 6; i++) {
                        const angle = (i / 6) * Math.PI * 2;
                        const x = half * Math.cos(angle);
                        const y = half * Math.sin(angle);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    break;
                case 'pentagon':
                    for (let i = 0; i < 5; i++) {
                        const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                        const x = half * Math.cos(angle);
                        const y = half * Math.sin(angle);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    break;
                default: // square
                    ctx.fillRect(-half, -half, size, size);
                    return;
            }

            ctx.fill();
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'voxel-background.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function getRandomRGB() {
            return [
                Math.floor(Math.random() * 256),
                Math.floor(Math.random() * 256),
                Math.floor(Math.random() * 256)
            ];
        }

        function getCubeColor() {
            const randomize = document.getElementById("randomizeColorToggle").checked;
            const cubeHex = document.getElementById("cubeColorInput").value;

            let rgb;
            if (randomize) {
                rgb = getRandomRGB();
            } else {
                rgb = [
                    parseInt(cubeHex.slice(1, 3), 16),
                    parseInt(cubeHex.slice(3, 5), 16),
                    parseInt(cubeHex.slice(5, 7), 16)
                ];
            }
            return rgb.map(c => (c / 255).toFixed(3)).map(Number);
        }

        function downloadJSON() {
            const width = parseInt(document.getElementById("widthInput").value, 10);
            const height = parseInt(document.getElementById("heightInput").value, 10);

            const jsonOutput = {
                namespace: "cubes",
                image: {
                    type: "image",
                    texture: "textures/ui/cube"
                },
                panel: {
                    layer: 1000,
                    type: "custom",
                    renderer: "gradient_renderer",
                    size: [width, height],
                    color1: hexToFloatArray(topColorHex),
                    color2: hexToFloatArray(bottomColorHex),
                    clips_children: true,
                    controls: [
                        {
                            panel: {
                                type: "panel",
                                controls: []
                            }
                        }
                    ]
                }
            };

            jsonOutput.panel.controls[0].panel.controls = placed.map(box => {
                const boxWidth = Math.round(box.right - box.left);
                const boxHeight = Math.round(box.bottom - box.top);
                const scaledWidthPercent = (boxWidth / width) * 100;
                const scaledHeightPercent = (boxHeight / height) * 100;
                const offsetXPercent = ((box.centerX - (width / 2)) / width) * 100;
                const offsetYPercent = ((box.centerY - (height / 2)) / height) * 100;
                const colorFloat = getCubeColor();

                return {
                    [`image@${jsonOutput.namespace}.image`]: {
                        size: [`${scaledWidthPercent.toFixed(2)}%`, `${scaledHeightPercent.toFixed(2)}%`],
                        offset: [`${offsetXPercent.toFixed(2)}%`, `${offsetYPercent.toFixed(2)}%`],
                        color: colorFloat,
                        alpha: parseFloat(box.alpha.toFixed(2))
                    }
                };
            });

            let rawJSON = JSON.stringify(jsonOutput, null, 2);
            rawJSON = rawJSON.replace(/\[\s+([^\[\]]+?)\s+\]/g, (match, content) => {
                return '[' + content.replace(/\s*,\s*/g, ', ').trim() + ']';
            });

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(rawJSON);
            const link = document.createElement('a');
            link.setAttribute("href", dataStr);
            link.setAttribute("download", "voxel_background.json");
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        function copyJSON() {
            const width = parseInt(document.getElementById("widthInput").value, 10);
            const height = parseInt(document.getElementById("heightInput").value, 10);

            const jsonOutput = {
                namespace: "cubes",
                image: {
                    type: "image",
                    texture: "textures/ui/cube"
                },
                panel: {
                    layer: 1000,
                    type: "custom",
                    renderer: "gradient_renderer",
                    size: [width, height],
                    color1: hexToFloatArray(topColorHex),
                    color2: hexToFloatArray(bottomColorHex),
                    clips_children: true,
                    controls: [
                        {
                            panel: {
                                type: "panel",
                                controls: []
                            }
                        }
                    ]
                }
            };

            jsonOutput.panel.controls[0].panel.controls = placed.map(box => {
                const boxWidth = Math.round(box.right - box.left);
                const boxHeight = Math.round(box.bottom - box.top);
                const scaledWidthPercent = (boxWidth / width) * 100;
                const scaledHeightPercent = (boxHeight / height) * 100;
                const offsetXPercent = ((box.centerX - (width / 2)) / width) * 100;
                const offsetYPercent = ((box.centerY - (height / 2)) / height) * 100;
                const colorFloat = getCubeColor();

                return {
                    [`image@${jsonOutput.namespace}.image`]: {
                        size: [`${scaledWidthPercent.toFixed(2)}%`, `${scaledHeightPercent.toFixed(2)}%`],
                        offset: [`${offsetXPercent.toFixed(2)}%`, `${offsetYPercent.toFixed(2)}%`],
                        color: colorFloat,
                        alpha: parseFloat(box.alpha.toFixed(2))
                    }
                };
            });

            let rawJSON = JSON.stringify(jsonOutput, null, 2);
            rawJSON = rawJSON.replace(/\[\s+([^\[\]]+?)\s+\]/g, (match, content) => {
                return '[' + content.replace(/\s*,\s*/g, ', ').trim() + ']';
            });

            navigator.clipboard.writeText(rawJSON).then(() => {
                alert('JSON copied to clipboard!');
            }, () => {
                alert('Failed to copy JSON.');
            });
        }

        window.addEventListener('resize', generate);
        generate();
    </script>
</body>

</html>
